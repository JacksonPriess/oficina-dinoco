spring:
  application:
    name: oficina-api

  profiles:
    active: dev,rabbit

  datasource:
    url: jdbc:postgresql://localhost:15433/oficina_db
    username: dbadmin
    password: adminpassword
    driver-class-name: org.postgresql.Driver

  jpa:
    # Desativa a auto-criação do Hibernate, pois o Flyway cuidará disso
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        # Formata o SQL no console para facilitar a leitura durante o debug
        format_sql: true
    show-sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    # Indica onde os scripts do Flyway ficarão (este é o padrão, mas é bom deixar explícito)
    locations: classpath:db/migration

# Logging estruturado em JSON
logging:
  structured:
    format:
      console: logstash

# Configuração da porta da sua API (opcional, 8080 é o padrão)
server:
  port: 8080

api:
  security:
    token:
      secret: ${JWT_SECRET:minha-chave-secreta-de-desenvolvimento-local-1234567890}

integracoes:
  catalogo-servico:
    base-url: ${CATALOGO_SERVICO_URL:http://localhost:8083}
    api-key: ${CATALOGO_SERVICO_API_KEY:servico-local-key}
  catalogo-produto:
    base-url: ${CATALOGO_PRODUTO_URL:http://localhost:8081}
    api-key: ${CATALOGO_API_KEY:chave-secreta-api-catalogo}

springdoc:
  server-url: ${OPENAPI_SERVER_URL:http://localhost:8080}
  swagger-ui:
    persistAuthorization: true
    tagsSorter: "alpha"

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: never