services:
  postgres:
    image: postgres:16-alpine
    container_name: oficina-postgres
    environment:
      POSTGRES_DB: oficina_db
      POSTGRES_USER: dbadmin
      POSTGRES_PASSWORD: adminpassword
      TZ: America/Sao_Paulo
    ports:
      - "15433:5432"
    volumes:
      - oficina_pg_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U dbadmin -d oficina_db" ]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oficina-api
    ports:
      - "8080:8080"
    environment:
      # Credenciais exclusivas do ambiente local via Docker Compose
      SPRING_PROFILES_ACTIVE: dev,rabbit
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/oficina_db
      SPRING_DATASOURCE_USERNAME: dbadmin
      SPRING_DATASOURCE_PASSWORD: adminpassword
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: oficina
      RABBITMQ_PASSWORD: oficina-local
      CATALOGO_PRODUTO_URL: http://catalogo-produto-api:8081
      CATALOGO_API_KEY: chave-secreta-api-catalogo
      CATALOGO_SERVICO_URL: http://catalogo-servico-api:8083
      CATALOGO_SERVICO_API_KEY: ${CATALOGO_SERVICO_API_KEY:-servico-local-key}
      TZ: America/Sao_Paulo
    networks:
      - default
      - dinoco
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

networks:
  dinoco:
    external: true
    name: dinoco-local

volumes:
  oficina_pg_data:
