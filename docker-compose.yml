services:
  postgres:
    image: postgres:16-alpine
    container_name: oficina-postgres
    environment:
      POSTGRES_DB: oficina_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      TZ: America/Sao_Paulo
    ports:
      - "5433:5432"
    volumes:
      - oficina_pg_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  oficina_pg_data: