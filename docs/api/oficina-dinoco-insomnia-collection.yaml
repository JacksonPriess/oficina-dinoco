        name: Verificar estoque (Condicional)
        meta:
          id: req_7599df0cd8d3439093e0270220aa82bd
          created: 1777231229336
          modified: 1778209495529
          isPrivate: false
          description: >
            Esse endpoint deve ser acionado apenas quando a OS foi APROVADA e
            não tem alguma peça no estoque.


            No fluxo da OS, quando não tem peça no momento da aprovação, o
            atendente deve: 


            1) realizar o pedido de compra com o fornecedor;

            2) aguardar o recebimento da peça;

            3) registrar uma alteração no produto, dizendo que as peças chegaram
            no estoque, isso vai gerar uma movimentação de estoque, para
            histórico.

            4) na sequencia, será necessário acessar esse endpoint que vai
            verificar se todos os itens de produto da OS estão com o saldo
            necessário para iniciar a execucao da OS pelo mecanico.
          sortKey: -1776294763998.1953
