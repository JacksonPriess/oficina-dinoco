            Input do ADMIN


            { 
            	"username": "admin", 
              "password": "123456" 
            }


            Funcionário novo com senha informada: 


            {
             "username" : "joao.silva",
             "password" : "joao2026"
            }


            Até consegue gerar o token, mas não consegue fazer nada na API,
            enquanto não trocar a senha. 


            Vai gerar erro:


            {
            	"timestamp": "2026-06-17T22:25:23.669142",
            	"status": 403,
            	"erro": "Acesso Bloqueado",
            	"mensagens": [
            		"Acesso negado. É obrigatório redefinir a senha provisória antes de continuar."
            	]
            }
          sortKey: -1789264682302
        method: POST
        body:
          mimeType: application/json
          text: '{ "username": "admin", "password": "123456" }'
        headers:
          - name: Content-Type
            value: application/json
          - name: User-Agent
            value: insomnia/12.5.0
            description: ""
            disabled: false
        authentication:
          type: none
        scripts:
          afterResponse: |-
            const response = insomnia.response.json();
            const token = response.token;
            insomnia.environment.set("token", token);
        settings:
          renderRequestBody: true
          encodeUrl: true
          followRedirects: global
          cookies:
            send: true
            store: true
          rebuildPath: true
