            atendente deve: 


            1) realizar o pedido de compra com o fornecedor;

            2) aguardar o recebimento da peça;

            3) registrar uma alteração no produto, dizendo que as peças chegaram
            no estoque, isso vai gerar uma movimentação de estoque, para
            histórico.

