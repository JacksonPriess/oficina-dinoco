          isPrivate: false
          description: >
            Esse endpoint /auth/cliente , está configurado para acionar a Lambda
            que fará 


            Validação do CPF;

            Consultar se cliente existe como ativo no banco;

            E gerar e retornar um token válido para que o cliente possa acessar
            outras rotas destinadas ao cliente.



            "cpf": "00018563082", do cliente id - 1
          sortKey: -1789264682402
        method: POST
        body:
