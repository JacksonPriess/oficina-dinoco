apiVersion: apps/v1
kind: Deployment
metadata:
  name: oficina-api-deployment
  labels:
    app: oficina-api
spec:
  replicas: 1 # Iniciamos com 1 pod; o HPA controlará o resto
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  progressDeadlineSeconds: 900
  selector:
    matchLabels:
      app: oficina-api
  template:
    metadata:
      labels:
        app: oficina-api
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      containers:
      - name: oficina-api
        # Substituído pela pipeline durante o deploy
        image: ${DOCKER_IMAGE}
        imagePullPolicy: Always
        ports:
        - containerPort: 8080 # Porta padrão interna exposta pelo Spring Boot
        
        # Injeta automaticamente todas as variáveis do ConfigMap e do Secret
        envFrom:
        - configMapRef:
            name: oficina-api-config
        - secretRef:
            name: oficina-api-secret
        - secretRef:
            name: nucleo-database-secret
        - secretRef:
            name: catalogo-integration-secret
        env:
        - name: CATALOGO_SERVICO_API_KEY
          valueFrom:
            secretKeyRef:
              name: catalogo-servico-integration-secret
              key: CATALOGO_SERVICO_API_KEY
        - name: RABBITMQ_USERNAME
          valueFrom:
            secretKeyRef:
              name: rabbitmq-secret
              key: username
        - name: RABBITMQ_PASSWORD
          valueFrom:
            secretKeyRef:
              name: rabbitmq-secret
              key: password
            
        startupProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8080
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3

        # CRUCIAL PARA O HPA: Sem estas definições, o Kubernetes não consegue calcular o escalonamento
        resources:
          requests:
            cpu: "250m"    # Garante 0.25 de um núcleo de CPU para o arranque estável do Spring
            memory: "512Mi" # Memória mínima inicial alocada
          limits:
            cpu: "500m"    # Teto máximo de utilização de processamento
            memory: "1Gi"   # Teto máximo de memória para evitar vazamentos (OutOfMemory)