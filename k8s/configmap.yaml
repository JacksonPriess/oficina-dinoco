apiVersion: v1
kind: ConfigMap
metadata:
  name: oficina-api-config
  labels:
    app: oficina-api
data:
  SPRING_PROFILES_ACTIVE: "k8s,rabbit"
  OPENAPI_SERVER_URL: "${OPENAPI_SERVER_URL}"
  NEW_RELIC_APP_NAME: "oficina-api"

  RABBITMQ_HOST: "rabbitmq"
  RABBITMQ_PORT: "5672"
  CATALOGO_PRODUTO_URL: "http://catalogo-produto-api-service:80"
  JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=60.0"

  TZ: "America/Sao_Paulo"